<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Eye</title>
<style>
  @font-face{
    font-family: 'Monthoers';
    src: url('assets/monthoers.ttf') format('truetype');
    font-display: swap;
  }
  :root{
    --ink:#41504F;
    --charcoal:#2A2620;
    --focus:#C9A96E;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }

  .app{
    display:flex; flex-direction:column; align-items:center;
    gap: 14px; width: 100%; padding: 24px 16px;
  }

  .reset-btn{
    position:fixed; top:16px; right:16px; z-index:50;
    background:none; border:none; cursor:pointer;
    padding:8px 10px;
    opacity:.75; transition: opacity .2s ease;
  }
  .reset-btn:hover{ opacity:1; }
  .reset-btn span{
    font-family: 'Monthoers', Georgia, serif;
    font-size: 1.725rem;
    color: #EAE1C8;
  }

  .yesno-btn{
    position:absolute;
    left:50%;
    background:none; border:none; cursor:pointer; padding:0;
    width: 52.5%;
    transform: translate(-50%, -50%);
    transition: transform .1s ease;
    z-index:5;
  }
  .yesno-btn:active{ transform: translate(-50%, -50%) scale(.94); }
  .yesno-btn span{
    display:block;
    font-family: 'Monthoers', Georgia, serif;
    font-size: 4.375rem;
    text-align:center;
    color: var(--charcoal);
    white-space:nowrap;
  }
  .yesno-btn span.selected{ color:#C63A1D; }
  .yesno-btn:disabled{ opacity:.35; cursor:default; }
  .yes-btn-pos{ top: 16%; }
  .no-btn-pos{ top: 84%; }

  .eye-stage{
    position:relative;
    width: min(92vw, 48vh);
    aspect-ratio: 910 / 1618;
    cursor:pointer;
  }
  .eye-stage.busy{ cursor:default; }

  .eye-backer, .eye-top{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; pointer-events:none; user-select:none;
    -webkit-user-drag:none;
  }
  .eye-top{ z-index:3; }
  .eye-backer{ z-index:1; }

  .eye-content{
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    container-type: inline-size;
  }

  .begin-text{
    font-family: 'Monthoers', Georgia, serif;
    font-size: 13cqw;
    color: var(--charcoal);
  }

  .lede-text{
    font-family: 'Monthoers', Georgia, serif;
    font-style: italic;
    color: var(--charcoal);
    opacity:.75;
    font-size: 5.2cqw;
    text-align:center;
    max-width: 68%;
    line-height:1.35;
  }

  .cloud{
    position:absolute; inset:0;
  }
  .cloud span{
    position:absolute;
    font-family: 'Monthoers', Georgia, serif;
    font-weight:600;
    color: var(--charcoal);
    font-size: 3.5cqw;
    line-height:1;
    text-align:center;
  }

  .pupils-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .pupils-frame{
    position:relative;
    width: 49.3%;
    aspect-ratio: 397 / 427;
  }
  .pupils-img{
    position:absolute; inset:0;
    width:100%; height:100%; display:block;
  }
  .pupil-text{
    position:absolute;
    font-family: 'Monthoers', Georgia, serif;
    font-weight:700;
    color:#EAE1C8;
    text-align:center;
    white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<button class="reset-btn" id="resetBtn" aria-label="Reset">
  <span>RESET</span>
</button>

<div class="app">
  <div class="eye-stage" id="eyeStage">
    <img class="eye-backer" src="assets/eye-backer.png" alt="">
    <div class="eye-content" id="eyeContent"></div>
    <img class="eye-top" id="eyeTop" src="assets/eye-window-open.png" alt="">
    <button class="yesno-btn yes-btn-pos" id="yesBtn" type="button" aria-label="Yes">
      <span id="yesText">YES</span>
    </button>
    <button class="yesno-btn no-btn-pos" id="noBtn" type="button" aria-label="No">
      <span id="noText">NO</span>
    </button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var eyeStage = document.getElementById('eyeStage');
  var eyeTop = document.getElementById('eyeTop');
  var eyeContent = document.getElementById('eyeContent');
  var yesBtn = document.getElementById('yesBtn');
  var noBtn = document.getElementById('noBtn');
  var yesText = document.getElementById('yesText');
  var noText = document.getElementById('noText');
  var resetBtn = document.getElementById('resetBtn');

  var EYE_GIF_SRC = 'assets/eye-window.png';
  var EYE_OPEN_SRC = 'assets/eye-window-open.png';
  var EYE_CLOSED_SRC = 'assets/eye-window-closed.png';

  var MIN_N = 1, MAX_N = 52, TOTAL = 6;
  var FRAME_MS = 90, FRAME_COUNT = 13, CLOSE_AT_FRAME = 4;
  var CLOSE_DELAY = CLOSE_AT_FRAME * FRAME_MS;      // 360ms: eye is shut, safe to swap content
  var BLINK_TOTAL = FRAME_COUNT * FRAME_MS;          // 1170ms: full blink duration

  var CLOSING_GIF_SRC = 'assets/eye-window-closing.png';
  var OPENING_GIF_SRC = 'assets/eye-window-opening.png';
  var CLOSING_DURATION = 5 * FRAME_MS;   // 450ms: open -> fully shut
  var OPENING_DURATION = 7 * FRAME_MS;   // 630ms: shut -> fully open
  var REVEAL_HOLD_MS = 2000;             // how long the eye stays shut before the reveal

  // ============================================================
  // number lists by bit position
  // ============================================================
  function numbersForBit(bit){
    var arr = [];
    for (var n = MIN_N; n <= MAX_N; n++){ if ((n >> bit) & 1) arr.push(n); }
    return arr;
  }
  var NUMBER_BIT_LISTS = [0,1,2,3,4,5].map(numbersForBit);

  function bitForPos(pos){ return TOTAL - pos; } // descending: pos1->32s ... pos6->1s

  // ============================================================
  // state
  // ============================================================
  function freshState(){
    return { idx: 0, answers: {}, answered: {}, busy: false };
  }
  var state = freshState();

  function decodeAnswers(){
    var value = 0;
    for (var pos = 1; pos <= TOTAL; pos++){
      var step = pos;
      var bit = bitForPos(pos);
      if (state.answers[step]) value += (1 << bit);
    }
    return value;
  }

  // ============================================================
  // yes/no buttons
  // ============================================================
  function listStep(idx){ return idx - 2; } // idx 3..8 -> step 1..6

  function updateAnswerButtons(){
    var show = state.idx >= 3 && state.idx <= 8;
    yesBtn.style.visibility = show ? 'visible' : 'hidden';
    noBtn.style.visibility = show ? 'visible' : 'hidden';
    var ans = show ? state.answers[listStep(state.idx)] : undefined;
    yesText.classList.toggle('selected', ans === true);
    noText.classList.toggle('selected', ans === false);
  }
  function handleAnswerTap(isYes){
    if (state.idx < 3 || state.idx > 8) return;
    var step = listStep(state.idx);
    state.answers[step] = isYes;
    state.answered[step] = true;
    updateAnswerButtons();
  }
  yesBtn.addEventListener('click', function(e){ e.stopPropagation(); handleAnswerTap(true); });
  noBtn.addEventListener('click', function(e){ e.stopPropagation(); handleAnswerTap(false); });

  // ============================================================
  // rendering each screen's content (drawn while the eye is open)
  // ============================================================
  // Safe scatter zone, verified against the actual eye mask (not a guessed
  // ellipse): center (50%, 50.7%), radii tuned so random points land inside
  // the true transparent window with a safety margin from the rim, and a
  // minimum pairwise distance (aspect-corrected, since the eye isn't square)
  // that keeps up to 26 items from overlapping. Verified with zero placement
  // failures across the worst-case 26-item lists before shipping this.
  function scatterPositions(n){
    var cx = 0.5, cy = 0.507;
    var rx = 0.13, ry = 0.075;
    var aspect = 1618 / 910;
    var minDist = 0.038;
    var pts = [];
    for (var i = 0; i < n; i++){
      var placed = false;
      for (var attempt = 0; attempt < 500; attempt++){
        var angle = Math.random() * Math.PI * 2;
        var r = Math.sqrt(Math.random());
        var x = cx + r * Math.cos(angle) * rx;
        var y = cy + r * Math.sin(angle) * ry;
        var ok = true;
        for (var j = 0; j < pts.length; j++){
          var dx = x - pts[j].x;
          var dy = (y - pts[j].y) * aspect;
          if (Math.sqrt(dx*dx + dy*dy) < minDist){ ok = false; break; }
        }
        if (ok){ pts.push({x:x, y:y}); placed = true; break; }
      }
      if (!placed) pts.push({x: cx, y: cy});
    }
    return pts;
  }

  function shuffledCopy(arr){
    var copy = arr.slice();
    for (var i = copy.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
    }
    return copy;
  }

  function renderContent(){
    eyeContent.innerHTML = '';

    if (state.idx === 0){
      var beginEl = document.createElement('div');
      beginEl.className = 'begin-text';
      beginEl.textContent = 'BEGIN';
      eyeContent.appendChild(beginEl);
      return;
    }

    if (state.idx === 1){
      var instr = document.createElement('div');
      instr.className = 'lede-text';
      instr.innerHTML = 'Think of a number<br>between 1 and 52.<br>Then tap the eye.';
      eyeContent.appendChild(instr);
      return;
    }

    if (state.idx === 2){
      var instr2 = document.createElement('div');
      instr2.className = 'lede-text';
      instr2.innerHTML = 'Tap yes if you see<br>your number.<br>Tap no if you don\u2019t.<br>Then tap the eye.';
      eyeContent.appendChild(instr2);
      return;
    }

    if (state.idx >= 3 && state.idx <= 8){
      var step = listStep(state.idx);
      var bit = bitForPos(step);
      var cloud = document.createElement('div');
      cloud.className = 'cloud';
      var positions = scatterPositions(NUMBER_BIT_LISTS[bit].length);
      shuffledCopy(NUMBER_BIT_LISTS[bit]).forEach(function(n, i){
        var s = document.createElement('span');
        s.textContent = n;
        s.style.left = (positions[i].x * 100) + '%';
        s.style.top = (positions[i].y * 100) + '%';
        s.style.transform = 'translate(-50%, -50%) rotate(' + (Math.random()*20-10) + 'deg)';
        cloud.appendChild(s);
      });
      eyeContent.appendChild(cloud);
      return;
    }

    // idx 9: reveal handled separately by playReveal(), leave blank here
  }

  // ============================================================
  // the pupils reveal: arcs in from top or bottom, lands center-ish,
  // each pupil's text independently jittered in rotation
  // ============================================================
  function playReveal(){
    var decodedNumber = decodeAnswers();

    var wrap = document.createElement('div');
    wrap.className = 'pupils-wrap';

    // this frame's box exactly matches the pupils sprite's own aspect ratio,
    // so percentage-positioned text lands on the actual pupils, not on the
    // much larger surrounding eye-content box
    var frame = document.createElement('div');
    frame.className = 'pupils-frame';

    var img = document.createElement('img');
    img.className = 'pupils-img';
    img.src = 'assets/pupils.png';
    frame.appendChild(img);

    // text position as % of the pupils image's own box (from the measured
    // center of the number pupil in the 397x427 cropped sprite: (135,134)).
    // The second pupil is left intentionally blank -- no card in this version.
    var numText = document.createElement('div');
    numText.className = 'pupil-text';
    numText.style.left = (135/397*100) + '%';
    numText.style.top = (134/427*100) + '%';
    numText.style.fontSize = '9cqw';
    numText.style.color = '#D0D0D1';
    numText.textContent = decodedNumber;

    frame.appendChild(numText);
    wrap.appendChild(frame);
    eyeContent.appendChild(wrap);

    // randomized: enter from top or bottom, land center-ish, tilted slightly
    var fromTop = Math.random() < 0.5;
    var jitterX = (Math.random() * 16 - 8);   // final resting offset, "center-ish"
    var jitterY = (Math.random() * 16 - 8);
    var startY = fromTop ? -90 : 90;
    var midY = fromTop ? -20 : 20;
    var arcSide = Math.random() < 0.5 ? 1 : -1;
    var startX = arcSide * 30;
    var midX = arcSide * 10;

    numText.style.transform = 'translate(-50%, -50%) rotate(' + (Math.random()*16-8) + 'deg)';

    var anim = frame.animate([
      { transform: 'translate(' + startX + 'px,' + startY + 'px)' },
      { transform: 'translate(' + midX + 'px,' + midY + 'px)', offset: 0.55 },
      { transform: 'translate(' + jitterX + 'px,' + jitterY + 'px)' }
    ], { duration: 3600, easing: 'cubic-bezier(.22,.61,.36,1)', fill: 'forwards' });

    return anim;
  }

  // ============================================================
  // navigation: tap the eye to blink and advance
  // ============================================================
  function canAdvance(){
    if (state.idx === 0) return true;
    if (state.idx === 1) return true;
    if (state.idx === 2) return true;
    if (state.idx >= 3 && state.idx <= 8) return !!state.answered[listStep(state.idx)];
    return false; // idx 9: terminal reveal
  }

  function blinkAndAdvance(){
    if (state.busy) return;
    if (!canAdvance()) return;

    if (state.idx === 8){
      closeHoldOpenThenReveal();
      return;
    }

    state.busy = true;
    eyeStage.classList.add('busy');

    eyeTop.src = EYE_GIF_SRC;

    setTimeout(function(){
      // eye is fully shut here -- safe to swap content with nothing visible
      state.idx += 1;
      renderContent();
      updateAnswerButtons();
    }, CLOSE_DELAY);

    setTimeout(function(){
      eyeTop.src = EYE_OPEN_SRC;
      eyeStage.classList.remove('busy');
      state.busy = false;
    }, BLINK_TOTAL);
  }

  function closeHoldOpenThenReveal(){
    state.busy = true;
    eyeStage.classList.add('busy');

    eyeTop.src = CLOSING_GIF_SRC;

    setTimeout(function(){
      // eye is now shut -- explicitly hold on a static frame rather than
      // trusting a played-out GIF to sit still, which isn't reliable
      // across every browser's handling of a non-looping GIF's last frame
      eyeTop.src = EYE_CLOSED_SRC;
      state.idx += 1; // -> 9, the reveal
      eyeContent.innerHTML = '';
    }, CLOSING_DURATION);

    setTimeout(function(){
      eyeTop.src = OPENING_GIF_SRC;
    }, CLOSING_DURATION + REVEAL_HOLD_MS);

    setTimeout(function(){
      eyeStage.classList.remove('busy');
      state.busy = false;
      playReveal();
    }, CLOSING_DURATION + REVEAL_HOLD_MS + OPENING_DURATION);
  }

  eyeStage.addEventListener('click', blinkAndAdvance);

  // ============================================================
  // reset
  // ============================================================
  function resetAll(){
    state = freshState();
    eyeTop.src = EYE_OPEN_SRC;
    eyeStage.classList.remove('busy');
    renderContent();
    updateAnswerButtons();
  }
  resetBtn.addEventListener('click', resetAll);

  // ============================================================
  // init
  // ============================================================
  renderContent();
  updateAnswerButtons();
})();
</script>
</body>
</html>
